# Single-character names allowed by convention (General N3). This is clippy's
# default list, written out so it is visible; setting the key replaces the
# default rather than extending it. If clippy flags generic parameters, add the
# conventional ones here ("T", "K", "V", …).
allowed-idents-below-min-chars = ["i", "j", "n", "x", "y", "z", "w"]
too-many-arguments-threshold = 5           # more means a missing type (F3)
max-fn-params-bools = 1                    # boolean traps (F2, C-CUSTOM-TYPE)
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
doc-valid-idents = ["..", "PulseAudio", "XEmbed", "XTest"]   # extend per project
# Trait methods whose standard parameter names are single letters (`f` in
# `fmt`), so implementations may use whole words (N3) without tripping
# `renamed_function_params`. ".." keeps clippy's own defaults.
allow-renamed-params-for = [
    "..",
    "core::fmt::Display",
    "core::fmt::Debug",
    # serde names visitor parameters `v`, `seq` and `map`; vaht names them.
    "serde::de::Visitor",
    # Smithay's parameter `type_` works around a keyword; vaht names it.
    "smithay::wayland::selection::data_device::WaylandDndGrabHandler",
    # Smithay calls the compositor state `data`; vaht says what it is.
    "smithay::input::pointer::PointerGrab",
    # The client toolkit calls its queue handle `qh`; vaht's tests use words.
    "smithay_client_toolkit::shell::xdg::window::WindowHandler",
    "smithay_client_toolkit::shell::wlr_layer::LayerShellHandler",
]
# Registrations that bypass vaht's guards would leak (03 §2).
disallowed-methods = [
    { path = "calloop::LoopHandle::insert_source", reason = "register through vaht_compositor::event_source::EventSource, which unregisters on drop" },
]
