# vaht: the default layout, what is shown and how it is arranged when no
# layout says otherwise: the taskbar and what is on it, the window buttons,
# window opacity, the snap picker and blur.
#
# This file is installed as /usr/share/vaht/layouts/default.toml, and vaht has a
# copy built in, so the default layout needs no file. Copy it to
# ~/.config/vaht/layouts/<name>.toml and change it to make a layout of your
# own; `layout = "<name>"` in settings.toml (or `vaht config set layout
# <name>`) chooses it. A layout holds presentation settings only, never
# behavior, and a setting in settings.toml wins over the layout's.

[windows]
# How opaque windows are, focused and not: 0 to 255 (opaque). set-alpha
# changes one window's.
focused_alpha = 255
unfocused_alpha = 255

[windows.snapping]
# Whether dragging to the top edge shows a picker of layouts: letting go on
# a layout's cell puts the window there.
layout_picker = false
# Each layout's thumbnail width (60 to 300), and how many to a row (0: as
# many as fit).
picker_size = 120
picker_columns = 4
# The layouts: each a list of cells, [x, y, width, height] in thousandths of
# the usable area, as tile takes them.
layouts = [
    [[0, 0, 667, 1000], [667, 0, 333, 1000]],
    [[0, 0, 500, 1000], [500, 0, 500, 1000]],
    [[0, 0, 333, 1000], [333, 0, 667, 1000]],
    [[0, 0, 1000, 500], [0, 500, 1000, 500]],
    [[0, 0, 250, 1000], [250, 0, 500, 1000], [750, 0, 250, 1000]],
    [[0, 0, 333, 1000], [333, 0, 334, 1000], [667, 0, 333, 1000]],
    [[0, 0, 500, 1000], [500, 0, 500, 500], [500, 500, 500, 500]],
    [[0, 0, 500, 500], [500, 0, 500, 500], [0, 500, 500, 500], [500, 500, 500, 500]],
]

[windows.frame]
# Buttons: shade, stick, minimize, maximize, close, menu (the window menu).
titlebar_left = []
titlebar_right = ["minimize", "maximize", "close"]
# A strip along the bottom, with a resize grip at each end; the style's
# window.handle height sets how tall.
handle = false
# Whether the titlebar shows the window's icon left of its title: the one
# the window names or draws, else its application's.
icon = true

[taskbar]
enabled = true
# How many rows tall it is, each as tall as the style's taskbar: a number
# (always that many), or "auto": one, and another whenever the window list
# reaches row_limit, up to max_rows. The window list and the tray wrap across
# the rows; the tray never adds one.
rows = 1
max_rows = 3
# What makes a taskbar with rows = "auto" take another row: entries narrower
# than { percent = <1 to 100> } of the width of the output the taskbar is on,
# or than a number of pixels; or more windows in a row than
# { windows = <1 or more> }. It uses the fewest rows that stay within this.
row_limit = { percent = 15 }
# Whether every output has a taskbar; the one on `output` is then the main
# one, the only one with the tray.
on_every_output = false
# The output it shows on, by name, such as output = "HDMI-A-1"; without one,
# the primary output (outputs.toml).
# Whose windows each taskbar lists: "all" outputs', or its "own-output"'s.
windows = "all"
edge = "bottom"                     # or top
# How much of the edge it spans, 1 to 100 percent, and where it sits when
# narrower: left, center or right.
width_percent = 100
align = "center"
# Whether maximized and tiled windows leave the taskbar uncovered; an
# auto-hiding taskbar never reserves its space.
reserve_space = true
# Whether it hides until the pointer touches its edge, and how long after
# the pointer leaves it it hides again.
auto_hide = false
auto_hide_delay_ms = 500
# Left to right: workspace-previous, workspace-name, workspace-next,
# window-previous, window-next (focusing the window before or after in the
# window list), window-list, tray and clock.
widgets = ["workspace-previous", "workspace-name", "workspace-next", "window-list", "tray", "clock"]

[taskbar.window_list]
# Which windows have an entry: a window matcher, as bindings take one.
show = { workspace = "current" }
# How wide entries are: "fill" shares the whole list equally among them;
# { max = <pixels> } shares it, each at most that wide.
entry_width = "fill"
# Whether entries show their application's icon: the one the window names,
# else its desktop entry's, from the hicolor style or pixmaps.
icons = true

[taskbar.tray]
# Programs' status icons named here (by their id, in any case) go first,
# in this order, and those named in pin_right last.
pin_left = []
pin_right = []
# How long after a click on an item its program may bring its windows
# forward by itself, as its menu often cannot pass a token; 0 for never.
activation_grace_ms = 500

[taskbar.tooltips]
# Whether resting the pointer on an entry whose title does not fit, or on a
# tray item, shows a tooltip, and after how long.
enabled = true
delay_ms = 500

[taskbar.clock]
# strftime: %k:%M is the hour, space-padded, and the minutes.
format = "%k:%M"

[menus]
# Whether lists of windows show each window's icon beside its title.
window_icons = true

[blur]
# Whether programs that ask (foot's blur=yes, panels) have what is behind
# them blurred, as frosted glass. Off, vaht tells them it cannot.
enabled = true
# How wide (passes, 1 to 6: each halves the background once more) and how
# soft (spread, 1 to 10 pixels between samples) the blur is.
passes = 3
spread = 3
