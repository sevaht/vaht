# vaht: the default style. Dark grey gradients, white haloed text, a thin
# grey border; after the nacitar_fbstyle Fluxbox style by nacitar.
#
# This file is installed as /usr/share/vaht/styles/default.toml, and vaht has a
# copy built in, so the default style needs no file. Copy it to
# ~/.config/vaht/styles/<name>.toml and change it to make a style of your own;
# `style = "<name>"` in settings.toml (or `vaht config set style <name>`)
# chooses it. A style file is a whole style: what it leaves out is not taken
# from this one.
#
# A style gives a look to each element in each state, in four layers, each
# overriding the one before: [default], [state.<state>], [<element>], and
# [<element>.<state>]. Elements: window.titlebar, window.label,
# window.button, window.handle, window.grip, window.border, taskbar,
# taskbar.button, taskbar.workspace, taskbar.clock,
# taskbar.window-list.entry, taskbar.window-list.empty (the tray shows on
# the taskbar's own background), menu.title, menu.frame, menu.item,
# wireframe (a resize's outline: its border), tooltip, warning
# (vaht's notice that its configuration has problems: always drawn from this
# built-in copy, so a style of yours cannot hide it; the `warning` section
# here is what it looks like).
# Every length (padding, spacing, height, a border's width, corner_radius)
# is a number of pixels, or text of terms added and subtracted, each a number
# with a unit: px, em (times the size of the element's font) or lh (times a
# line of it, its ascent and descent): "1.5em", or "1lh + 2 + 6", the rule
# Fluxbox sizes a titlebar by, which a style can change.
# States:
# focused, unfocused, pressed, hovered (a menu's highlighted item; also a
# window button under the pointer, if [window.button.hovered] says how) and
# disabled (a menu item that does nothing).

# Options: choices this style offers (02 §10.5). A choice is a table of
# variables, and the values below refer to them as "$name"; a variable may be
# made of others (`focused` is made of `accent`), so a choice that gives
# `accent` anew changes everything made of it. Each option's `default` is
# written here, so this file works alone. Choose with `style_options` in
# settings.toml:
# style_options = { palette = "blue", shading = "soft", taskbar_size = "large" }.
#
# The look is one appearance, used wherever it applies:
#   a focused face     the focused window's titlebar, the taskbar's focused
#                      entry and a menu's title: the palette's `accent`, a
#                      gradient; its border, and a menu's, are the accent too;
#   an unfocused face  an unfocused window's titlebar and the taskbar's other
#                      entries;
#   the ground         what the taskbar's bar and its clock sit on.
# Its choices are:
#   `palette`    the colors, named for what they look like (more are
#                installed in /usr/share/vaht/options/palette; yours go in
#                ~/.config/vaht/options/palette). A palette may set any of the
#                colors below and leaves the rest as they are here, made of
#                the first seven; it may also say `group = "Blues"`, which a
#                list of palettes shows it under;
#   `unfocused`  whose colors the unfocused windows and the taskbar's other
#                faces are in: `matching`, the palette's own, so the palette
#                colors everything, or any other palette's (graphite's greys
#                for a grey style with only the focused window in color);
#                /usr/share/vaht/options/unfocused has one for each palette;
#   `shading`    how dark the fades go: deep (near black) or soft (muted).
# What a menu holds is the one exception: `menu_body` is dark or filled in, and
# the palette gives each its own color and its own selection. A menu's marks
# are always the modern ones (chevrons and a tick); a style may use the classic
# ones (`bullet = "triangle"`, `check = "box"`). Windows are square and menus
# rounded. The rest are one thing each: the text outline, on for the titlebars
# and taskbar and for menus (marks included) separately, and three sizes.

[options.palette]
label = "Palette"
default = "graphite"
[options.palette.graphite]
dark = "grey5"          # the dark end of gradients; the ground, flat
mid = "grey30"          # an unfocused face
dark_soft = "#2e2e2e"   # the same, when the shading is soft: not so dark
mid_soft = "#404040"
light = "grey55"        # the usual accent
dim = "grey55"          # unfocused text and pictures
press_dark = "grey20"   # a pressed button
press_light = "grey40"
menu = "black"          # a menu's body
# The colors made of those, which a palette may give whole:
menu_filled = "#282828"    # a menu's body, when it is filled in: dark and muted
text = "white"
accent = "$light"       # focused: a titlebar, a taskbar entry, a menu's title,
                        # and the border of a window and a menu
on_accent = "$text"     # text and pictures on it
select_bg = "#ffffff40"     # behind the selected menu item,
select_text = "white"       # its text and its marks,
select_bg_filled = "#ffffff40"     # and on a filled-in menu
select_text_filled = "white"
disabled = "$dim"       # a menu item that does nothing
halo = "black"          # the color of the text outline

# The unfocused colors: those of the unfocused windows and of the faces of the
# taskbar that are not the focused one. `matching` takes them from the palette's
# own darks, so the whole style is in its hue; another palette's name takes
# that palette's, so any palette is a color on, say, graphite's greys. (A
# palette of yours is another by a file of the same name in
# ~/.config/vaht/options/unfocused.)
[options.unfocused]
label = "Unfocused windows"
default = "matching"
[options.unfocused.matching]
unf_dark = "$dark"
unf_mid = "$mid"
unf_dark_soft = "$dark_soft"
unf_mid_soft = "$mid_soft"
unf_press_dark = "$press_dark"
unf_press_light = "$press_light"
unf_dim = "$dim"
unf_text = "$text"

# How dark the shading goes: `deep` fades to the palette's `dark`, near black;
# `soft` to its `dark_soft`, a muted one, and the unfocused faces are the
# `mid_soft` and `dark_soft` of the palette they are in. A face is a gradient;
# only a pressed button has a bevel, and the taskbar has no border line.
[options.shading]
label = "Shading"
group = "Misc"
checkbox = "Softer shading"
default = "deep"
[options.shading.deep]
shade_fade = "$dark"
shade_dark = "$unf_dark"
shade_mid = "$unf_mid"
focused = { gradient = "vertical", from = "$accent", to = "$shade_fade" }
unfocused = { gradient = "vertical", from = "$shade_mid", to = "$shade_dark" }
ground = "$unfocused"
pressed = { gradient = "cross-diagonal", from = "$unf_press_dark", to = "$unf_press_light", bevel = "sunken" }
[options.shading.soft]
shade_fade = "$dark_soft"
shade_dark = "$unf_dark_soft"
shade_mid = "$unf_mid_soft"

# A menu's body: dark, or filled in a little (about halfway to a flat panel).
# The palette gives each its own selection.
[options.menu_body]
label = "Menu background"
group = "Misc"
checkbox = "Filled-in menu background"
default = "dark"
[options.menu_body.dark]
menu_body = "$menu"
menu_select_bg = "$select_bg"
menu_select_text = "$select_text"
[options.menu_body.filled]
menu_body = "$menu_filled"
menu_select_bg = "$select_bg_filled"
menu_select_text = "$select_text_filled"

# Whether text has an outline (a halo), which keeps light text readable on any
# background: on, by default, for the text of the titlebars and the taskbar and
# for the text of menus (and their marks), each on its own.
[options.bar_outline]
label = "Taskbar/Titlebar text outline"
group = "Text Outlines"
checkbox = "Taskbar/Titlebar"
checked = "on"
default = "on"
[options.bar_outline.on]
bar_outline = { halo = "$halo" }
[options.bar_outline.off]
bar_outline = "none"

[options.menu_outline]
label = "Menu text outline"
group = "Text Outlines"
checkbox = "Menus"
checked = "on"
default = "on"
[options.menu_outline.on]
menu_outline = { halo = "$halo" }
[options.menu_outline.off]
menu_outline = "none"

# The heights and font sizes of a window's titlebar, the taskbar and a menu,
# each its own option.
[options.titlebar_size]
label = "Titlebar size"
group = "Sizes"
default = "medium"
[options.titlebar_size.small]
titlebar_height = 17
title_font_size = 7
button_pad = 3          # the room round a titlebar button's picture
[options.titlebar_size.medium]
titlebar_height = 20
title_font_size = 8
button_pad = 4
[options.titlebar_size.large]
titlebar_height = 26
title_font_size = 10
button_pad = 5

[options.taskbar_size]
label = "Taskbar size"
group = "Sizes"
default = "medium"
[options.taskbar_size.small]
taskbar_height = 17
taskbar_font_size = 7
[options.taskbar_size.medium]
taskbar_height = 20
taskbar_font_size = 8
[options.taskbar_size.large]
taskbar_height = 26
taskbar_font_size = 10
[options.taskbar_size.xlarge]
taskbar_height = 30
taskbar_font_size = 11

[options.menu_size]
label = "Menu size"
group = "Sizes"
default = "medium"
[options.menu_size.small]
menu_item_height = 17
menu_title_height = 17
menu_font_size = 7
[options.menu_size.medium]
menu_item_height = 20
menu_title_height = 20
menu_font_size = 8
[options.menu_size.large]
menu_item_height = 26
menu_title_height = 26
menu_font_size = 10

[default]
texture = "$ground"
font = { family = "DejaVu Sans", size = "$title_font_size", weight = "bold" }
text_effect = "$bar_outline"
text_color = "$unf_text"
glyph_color = "$unf_text"
justify = "center"

[window.titlebar]
texture = "$focused"
height = "$titlebar_height"

[window.titlebar.unfocused]
texture = "$unfocused"

[window.label]
texture = "parent"
text_color = "$on_accent"
text_effect = "$bar_outline"
padding = [0, 4, 0, 4]

[window.label.unfocused]
text_color = "$unf_dim"
text_effect = "$bar_outline"

[window.button]
texture = "parent"
glyph_color = "$on_accent"
# The room round a button's picture: the button is 20 pixels, so 4 leaves a
# 12 pixel picture (Fluxbox draws it 2 pixels inside, a 16 pixel picture).
padding = "$button_pad"
# Whether a maximized window's maximize button is drawn as a restore button
# (the default); false keeps it the maximize button.
# restore_glyph = false

[window.button.unfocused]
glyph_color = "$unf_dim"

[window.button.pressed]
texture = "$pressed"

[window.handle]
texture = "$focused"
height = 1

[window.handle.unfocused]
texture = "$unfocused"

[window.grip]
texture = "$focused"

[window.grip.unfocused]
texture = "$unfocused"

[window.border]
border = { width = 1, color = "$accent" }

[window.border.unfocused]
border = { width = 1, color = "$shade_mid" }

[taskbar]
texture = "$ground"
border = { width = 0, color = "$accent" }
height = "$taskbar_height"

[taskbar.button]
padding = 0

[taskbar.button.pressed]
texture = "$pressed"

[taskbar.workspace]
texture = "$ground"
font = { family = "DejaVu Sans", size = "$taskbar_font_size", weight = "bold" }
padding = [0, 1, 0, 1]

[taskbar.clock]
texture = "$ground"
font = { family = "DejaVu Sans", size = "$taskbar_font_size", weight = "bold" }
padding = [0, 8, 0, 8]

[taskbar.window-list.entry]
texture = "$focused"
font = { family = "DejaVu Sans", size = "$taskbar_font_size", weight = "bold" }
text_color = "$on_accent"
text_effect = "$bar_outline"
padding = [0, 5, 0, 5]

[taskbar.window-list.entry.unfocused]
texture = "$unfocused"
text_color = "$unf_dim"
text_effect = "$bar_outline"

[menu.title]
texture = "$focused"
font = { family = "DejaVu Sans", size = "$menu_font_size", weight = "bold" }
text_color = "$on_accent"
text_effect = "$menu_outline"
height = "$menu_title_height"

[menu.frame]
texture = { solid = "$menu_body" }
font = { family = "DejaVu Sans", size = "$menu_font_size" }
text_color = "$text"
text_effect = "$menu_outline"
justify = "left"
border = { width = 1, color = "$accent" }
corner_radius = 8

[menu.item]
texture = "parent"
font = { family = "DejaVu Sans", size = "$menu_font_size" }
text_color = "$text"
text_effect = "$menu_outline"
glyph_color = "$text"
justify = "left"
padding = [0, 20, 0, 21]
height = "$menu_item_height"
bullet = "chevron"
bullet_position = "right"
check = "tick"

[menu.item.hovered]
texture = { solid = "$menu_select_bg" }
font = { family = "DejaVu Sans", size = "$menu_font_size", weight = "bold" }
text_color = "$menu_select_text"
text_effect = "$menu_outline"
glyph_color = "$menu_select_text"
bullet = "double-chevron"

[menu.item.disabled]
text_color = "$disabled"

[wireframe]
border = { width = 2, color = "#ffffffcc" }

[tooltip]
texture = { solid = "#000000" }
font = { family = "DejaVu Sans", size = 11 }
text_color = "#ffffff"
justify = "left"
padding = [8, 14, 8, 13]
border = { width = 1, color = "#191919" }
corner_radius = 5

[warning]
# Impossible to miss: white on red.
texture = { gradient = "vertical", from = "red3", to = "red4" }
font = { family = "DejaVu Sans", size = 11, weight = "bold" }
text_effect = "none"
text_color = "white"
justify = "left"
padding = [4, 14, 4, 14]
border = { width = 2, color = "white" }
