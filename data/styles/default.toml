# vaht: the default style. Dark grey gradients, white haloed text, a thin
# grey border; after the nacitar_fbstyle Fluxbox style by nacitar.
#
# This file is installed as /usr/share/vaht/styles/default.toml, and vaht has a
# copy built in, so the default style needs no file. Copy it to
# ~/.config/vaht/styles/<name>.toml and change it to make a style of your own;
# `style = "<name>"` in settings.toml (or `vaht config set style <name>`)
# chooses it. A style file is a whole style: what it leaves out is not taken
# from this one.
#
# A style gives a look to each element in each state, in four layers, each
# overriding the one before: [default], [state.<state>], [<element>], and
# [<element>.<state>]. Elements: window.titlebar, window.label,
# window.button, window.handle, window.grip, window.border, taskbar,
# taskbar.button, taskbar.workspace, taskbar.clock,
# taskbar.window-list.entry, taskbar.window-list.empty (the tray shows on
# the taskbar's own background), menu.title, menu.frame, menu.item,
# wireframe (a resize's outline: its border), tooltip, warning
# (vaht's notice that its configuration has problems: always drawn from this
# built-in copy, so a style of yours cannot hide it; the `warning` section
# here is what it looks like).
# Every length (padding, spacing, height, a border's width, corner_radius)
# is a number of pixels, or text of terms added and subtracted, each a number
# with a unit: px, em (times the size of the element's font) or lh (times a
# line of it, its ascent and descent): "1.5em", or "1lh + 2 + 6", the rule
# Fluxbox sizes a titlebar by, which a style can change.
# States:
# focused, unfocused, pressed, hovered (a menu's highlighted item; also a
# window button under the pointer, if [window.button.hovered] says how) and
# disabled (a menu item that does nothing).

# Options: choices this style offers (02 §10.5). A choice is a table of
# variables, and the values below refer to them as "$name"; a variable may be
# made of others (`fc_face` is made of `fc_accent`), so a choice that gives
# `fc_accent` anew changes everything made of it. Each option's `default` is
# written here, so this file works alone. Choose with `style_options` in
# settings.toml:
# style_options = { palette = "blue", focused_palette = "amber", shading = "soft" }.
#
# The look is made of four parts, each its own palette, outline and shading:
#   the taskbar          its bar, the workspace name and arrows, the tray and the
#                        clock: `palette`, graphite unless chosen;
#   focused windows      a focused window's titlebar, title, buttons, border and
#                        handles, and the taskbar's focused entry
#                        (`focused_palette`);
#   unfocused windows    the same for the others, and the taskbar's other
#                        entries (`unfocused_palette`);
#   menus                a menu's title, border, body, items and marks
#                        (`menu_palette`).
# The other three palettes are `match_taskbar` (the taskbar's) unless chosen, so one
# choice colors everything, and any of them may be another palette: graphite's
# greys with only the focused windows in color, say. A palette is a file in
# /usr/share/vaht/options/palette (yours go in ~/.config/vaht/options/palette)
# that may set any of the colors below and leaves the rest as they are here,
# made of the first seven; it may also say `group = "Blues"`, which a list of
# palettes shows it under. Every part's list is the same palettes.
#
# Each part also has an outline (a halo that keeps light text readable on any
# background) and a shading (how dark its gradients fade: deep, near black, or
# soft, muted); each is `match_global`, the global one, `outline` (on) and
# `shading` (deep, "Softer Gradient Shading" off), unless chosen. A menu's body
# is dark or filled in, and the palette gives each its own selection. A menu's
# marks are the modern ones (chevrons and a tick); a style may use the classic
# ones (`bullet = "triangle"`, `check = "box"`). Windows are square and menus
# rounded. Three sizes are the rest.

[options.palette]
label = "Palette"
order = 10
group = "Taskbar"
default = "graphite"
[options.palette.graphite]
dark = "grey5"          # the dark end of gradients; the ground, flat
mid = "grey30"          # an unfocused face
dark_soft = "#2e2e2e"   # the same, when the shading is soft: not so dark
mid_soft = "#404040"
light = "grey55"        # the usual accent
dim = "grey55"          # unfocused text and pictures
press_dark = "grey20"   # a pressed button
press_light = "grey40"
menu = "black"          # a menu's body
# The colors made of those, which a palette may give whole:
menu_filled = "#282828"    # a menu's body, when it is filled in: dark and muted
text = "white"
accent = "$light"       # focused: a titlebar, a taskbar entry, a menu's title,
                        # and the border of a window and a menu
on_accent = "$text"     # text and pictures on it
select_bg = "#ffffff40"     # behind the selected menu item,
select_text = "white"       # its text and its marks,
select_bg_filled = "#ffffff40"     # and on a filled-in menu
select_text_filled = "white"
disabled = "$dim"       # a menu item that does nothing
halo = "black"          # the color of the text outline

# Whether text has an outline, for every part that does not say: on, by default.
[options.outline]
label = "Text outlines"
order = 1
checkbox = "Text Outlines"
checked = "on"
default = "on"
[options.outline.on]
g_tb_outline = { halo = "$halo" }
g_fc_outline = { halo = "$fc_halo" }
g_uf_outline = { halo = "$uf_halo" }
g_mn_outline = { halo = "$mn_halo" }
[options.outline.off]
g_tb_outline = "none"
g_fc_outline = "none"
g_uf_outline = "none"
g_mn_outline = "none"

# How dark gradients fade, for every part that does not say: `deep` fades to the
# palette's `dark`, near black; `soft` to its `dark_soft`, a muted one.
[options.shading]
label = "Gradient shading"
order = 2
checkbox = "Softer Gradient Shading"
default = "deep"
[options.shading.deep]
g_tb_dark = "$dark"
g_tb_mid = "$mid"
g_fc_fade = "$fc_dark"
g_uf_dark = "$uf_dark"
g_uf_mid = "$uf_mid"
g_mn_fade = "$mn_dark"
[options.shading.soft]
g_tb_dark = "$dark_soft"
g_tb_mid = "$mid_soft"
g_fc_fade = "$fc_dark_soft"
g_uf_dark = "$uf_dark_soft"
g_uf_mid = "$uf_mid_soft"
g_mn_fade = "$mn_dark_soft"

[options.taskbar_outline]
label = "Text outline"
order = 11
group = "Taskbar"
default = "match_global"
[options.taskbar_outline.match_global]
tb_outline = "$g_tb_outline"
[options.taskbar_outline.on]
tb_outline = { halo = "$halo" }
[options.taskbar_outline.off]
tb_outline = "none"

[options.taskbar_shading]
label = "Gradient shading"
order = 12
group = "Taskbar"
default = "match_global"
[options.taskbar_shading.match_global]
tb_dark = "$g_tb_dark"
tb_mid = "$g_tb_mid"
tb_ground = { gradient = "vertical", from = "$tb_mid", to = "$tb_dark" }
tb_pressed = { gradient = "cross-diagonal", from = "$press_dark", to = "$press_light", bevel = "sunken" }
[options.taskbar_shading.deep]
tb_dark = "$dark"
tb_mid = "$mid"
[options.taskbar_shading.soft]
tb_dark = "$dark_soft"
tb_mid = "$mid_soft"

[options.focused_palette]
label = "Palette"
order = 20
group = "Focused windows"
default = "match_taskbar"
library = "palette"
prefix = "fc_"
follows = "palette"
[options.focused_palette.match_taskbar]

[options.focused_outline]
label = "Text outline"
order = 21
group = "Focused windows"
default = "match_global"
[options.focused_outline.match_global]
fc_outline = "$g_fc_outline"
[options.focused_outline.on]
fc_outline = { halo = "$fc_halo" }
[options.focused_outline.off]
fc_outline = "none"

[options.focused_shading]
label = "Gradient shading"
order = 22
group = "Focused windows"
default = "match_global"
[options.focused_shading.match_global]
fc_fade = "$g_fc_fade"
fc_face = { gradient = "vertical", from = "$fc_accent", to = "$fc_fade" }
[options.focused_shading.deep]
fc_fade = "$fc_dark"
[options.focused_shading.soft]
fc_fade = "$fc_dark_soft"

[options.unfocused_palette]
label = "Palette"
order = 30
group = "Unfocused windows"
default = "match_taskbar"
library = "palette"
prefix = "uf_"
follows = "palette"
[options.unfocused_palette.match_taskbar]

[options.unfocused_outline]
label = "Text outline"
order = 31
group = "Unfocused windows"
default = "match_global"
[options.unfocused_outline.match_global]
uf_outline = "$g_uf_outline"
[options.unfocused_outline.on]
uf_outline = { halo = "$uf_halo" }
[options.unfocused_outline.off]
uf_outline = "none"

[options.unfocused_shading]
label = "Gradient shading"
order = 32
group = "Unfocused windows"
default = "match_global"
[options.unfocused_shading.match_global]
uf_shade_dark = "$g_uf_dark"
uf_shade_mid = "$g_uf_mid"
uf_face = { gradient = "vertical", from = "$uf_shade_mid", to = "$uf_shade_dark" }
[options.unfocused_shading.deep]
uf_shade_dark = "$uf_dark"
uf_shade_mid = "$uf_mid"
[options.unfocused_shading.soft]
uf_shade_dark = "$uf_dark_soft"
uf_shade_mid = "$uf_mid_soft"

[options.menu_palette]
label = "Palette"
order = 40
group = "Menus"
default = "match_taskbar"
library = "palette"
prefix = "mn_"
follows = "palette"
[options.menu_palette.match_taskbar]

[options.menu_outline]
label = "Text outline"
order = 41
group = "Menus"
default = "match_global"
[options.menu_outline.match_global]
mn_outline = "$g_mn_outline"
[options.menu_outline.on]
mn_outline = { halo = "$mn_halo" }
[options.menu_outline.off]
mn_outline = "none"

[options.menu_shading]
label = "Gradient shading"
order = 42
group = "Menus"
default = "match_global"
[options.menu_shading.match_global]
mn_fade = "$g_mn_fade"
mn_face = { gradient = "vertical", from = "$mn_accent", to = "$mn_fade" }
[options.menu_shading.deep]
mn_fade = "$mn_dark"
[options.menu_shading.soft]
mn_fade = "$mn_dark_soft"

# A menu's body: dark, or filled in a little (about halfway to a flat panel).
# The palette gives each its own selection.
[options.menu_body]
label = "Background"
order = 43
group = "Menus"
checkbox = "Filled-in menu background"
default = "dark"
[options.menu_body.dark]
menu_body = "$mn_menu"
menu_select_bg = "$mn_select_bg"
menu_select_text = "$mn_select_text"
[options.menu_body.filled]
menu_body = "$mn_menu_filled"
menu_select_bg = "$mn_select_bg_filled"
menu_select_text = "$mn_select_text_filled"

# The heights and font sizes of a window's titlebar, the taskbar and a menu,
# each its own option.
[options.titlebar_size]
label = "Titlebar"
order = 51
group = "Sizes"
default = "medium"
[options.titlebar_size.small]
titlebar_height = 17
title_font_size = 7
button_pad = 3          # the room round a titlebar button's picture
[options.titlebar_size.medium]
titlebar_height = 20
title_font_size = 8
button_pad = 4
[options.titlebar_size.large]
titlebar_height = 26
title_font_size = 10
button_pad = 5

[options.taskbar_size]
label = "Taskbar"
order = 50
group = "Sizes"
default = "medium"
[options.taskbar_size.small]
taskbar_height = 17
taskbar_font_size = 7
[options.taskbar_size.medium]
taskbar_height = 20
taskbar_font_size = 8
[options.taskbar_size.large]
taskbar_height = 26
taskbar_font_size = 10
[options.taskbar_size.xlarge]
taskbar_height = 30
taskbar_font_size = 11

[options.menu_size]
label = "Menu"
order = 52
group = "Sizes"
default = "medium"
[options.menu_size.small]
menu_item_height = 17
menu_title_height = 17
menu_font_size = 7
[options.menu_size.medium]
menu_item_height = 20
menu_title_height = 20
menu_font_size = 8
[options.menu_size.large]
menu_item_height = 26
menu_title_height = 26
menu_font_size = 10

[default]
texture = "$tb_ground"
font = { family = "DejaVu Sans", size = "$title_font_size", weight = "bold" }
text_effect = "$tb_outline"
text_color = "$text"
glyph_color = "$text"
justify = "center"

[window.titlebar]
texture = "$fc_face"
height = "$titlebar_height"

[window.titlebar.unfocused]
texture = "$uf_face"

[window.label]
texture = "parent"
text_color = "$fc_on_accent"
text_effect = "$fc_outline"
padding = [0, 4, 0, 4]

[window.label.unfocused]
text_color = "$uf_dim"
text_effect = "$uf_outline"

[window.button]
texture = "parent"
glyph_color = "$fc_on_accent"
# The room round a button's picture: the button is 20 pixels, so 4 leaves a
# 12 pixel picture (Fluxbox draws it 2 pixels inside, a 16 pixel picture).
padding = "$button_pad"
# Whether a maximized window's maximize button is drawn as a restore button
# (the default); false keeps it the maximize button.
# restore_glyph = false

[window.button.unfocused]
glyph_color = "$uf_dim"

[window.button.pressed]
texture = "$tb_pressed"

[window.handle]
texture = "$fc_face"
height = 1

[window.handle.unfocused]
texture = "$uf_face"

[window.grip]
texture = "$fc_face"

[window.grip.unfocused]
texture = "$uf_face"

[window.border]
border = { width = 1, color = "$fc_accent" }

[window.border.unfocused]
border = { width = 1, color = "$uf_shade_mid" }

[taskbar]
texture = "$tb_ground"
border = { width = 0, color = "$accent" }
height = "$taskbar_height"

[taskbar.button]
padding = 0

[taskbar.button.pressed]
texture = "$tb_pressed"

[taskbar.workspace]
texture = "$tb_ground"
font = { family = "DejaVu Sans", size = "$taskbar_font_size", weight = "bold" }
padding = [0, 1, 0, 1]

[taskbar.clock]
texture = "$tb_ground"
font = { family = "DejaVu Sans", size = "$taskbar_font_size", weight = "bold" }
padding = [0, 8, 0, 8]

[taskbar.window-list.entry]
texture = "$fc_face"
font = { family = "DejaVu Sans", size = "$taskbar_font_size", weight = "bold" }
text_color = "$fc_on_accent"
text_effect = "$fc_outline"
padding = [0, 5, 0, 5]

[taskbar.window-list.entry.unfocused]
texture = "$uf_face"
text_color = "$uf_dim"
text_effect = "$uf_outline"

[menu.title]
texture = "$mn_face"
font = { family = "DejaVu Sans", size = "$menu_font_size", weight = "bold" }
text_color = "$mn_on_accent"
text_effect = "$mn_outline"
height = "$menu_title_height"

[menu.frame]
texture = { solid = "$menu_body" }
font = { family = "DejaVu Sans", size = "$menu_font_size" }
text_color = "$mn_text"
text_effect = "$mn_outline"
justify = "left"
border = { width = 1, color = "$mn_accent" }
corner_radius = 8

[menu.item]
texture = "parent"
font = { family = "DejaVu Sans", size = "$menu_font_size" }
text_color = "$mn_text"
text_effect = "$mn_outline"
glyph_color = "$mn_text"
justify = "left"
# The room at each side: a menu item's icon (18 pixels at the usual height, a
# pixel in) and a check mark or bullet (the item's height) fit in it, with a
# few pixels between them and the text.
padding = [0, 23, 0, 24]
height = "$menu_item_height"
bullet = "chevron"
bullet_position = "right"
check = "tick"

[menu.item.hovered]
texture = { solid = "$menu_select_bg" }
font = { family = "DejaVu Sans", size = "$menu_font_size", weight = "bold" }
text_color = "$menu_select_text"
text_effect = "$mn_outline"
glyph_color = "$menu_select_text"
bullet = "double-chevron"

[menu.item.disabled]
text_color = "$mn_disabled"

[wireframe]
border = { width = 2, color = "#ffffffcc" }

[tooltip]
texture = { solid = "#000000" }
font = { family = "DejaVu Sans", size = 11 }
text_color = "#ffffff"
justify = "left"
padding = [8, 14, 8, 13]
border = { width = 1, color = "#191919" }
corner_radius = 5

[warning]
# Impossible to miss: white on red.
texture = { gradient = "vertical", from = "red3", to = "red4" }
font = { family = "DejaVu Sans", size = 11, weight = "bold" }
text_effect = "none"
text_color = "white"
justify = "left"
padding = [4, 14, 4, 14]
border = { width = 2, color = "white" }
