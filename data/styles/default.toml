# vaht: the default style. Dark grey gradients, white haloed text, a thin
# grey border; after the nacitar_fbstyle Fluxbox style by nacitar.
#
# This file is installed as /usr/share/vaht/styles/default.toml, and vaht has a
# copy built in, so the default style needs no file. Copy it to
# ~/.config/vaht/styles/<name>.toml and change it to make a style of your own;
# `style = "<name>"` in settings.toml (or `vaht config set style <name>`)
# chooses it. A style file is a whole style: what it leaves out is not taken
# from this one.
#
# A style gives a look to each element in each state, in four layers, each
# overriding the one before: [default], [state.<state>], [<element>], and
# [<element>.<state>]. Elements: window.titlebar, window.label,
# window.button, window.handle, window.grip, window.border, taskbar,
# taskbar.button, taskbar.workspace, taskbar.clock,
# taskbar.window-list.entry, taskbar.window-list.empty (the tray shows on
# the taskbar's own background), menu.title, menu.frame, menu.item,
# wireframe (a resize's outline: its border), tooltip, warning
# (vaht's notice that its configuration has problems: always drawn from this
# built-in copy, so a style of yours cannot hide it; the `warning` section
# here is what it looks like).
# Every length (padding, spacing, height, a border's width, corner_radius)
# is a number of pixels, or text of terms added and subtracted, each a number
# with a unit: px, em (times the size of the element's font) or lh (times a
# line of it, its ascent and descent): "1.5em", or "1lh + 2 + 6", the rule
# Fluxbox sizes a titlebar by, which a style can change.
# States:
# focused, unfocused, pressed, hovered (a menu's highlighted item; also a
# window button under the pointer, if [window.button.hovered] says how) and
# disabled (a menu item that does nothing).

# Options: choices this style offers (02 §10.5). A choice is a table of
# variables, and the values below refer to them as "$name"; a variable may be
# made of others (`surface` is made of `mid` and `dark`), so a choice that gives
# `dark` anew changes everything made of it. Each option's `default` is written
# here, so this file works alone; more choices of `scheme` are installed in
# /usr/share/vaht/options/scheme (and yours go in ~/.config/vaht/options/scheme),
# and any style that declares `scheme` with these variable names can use them.
# Choose with `style_options` in settings.toml:
# style_options = { scheme = "blue", taskbar_size = "xlarge" }.
#
# `scheme`: the colors (the first group of variables, which a scheme need only
# change to tint the style) and what each part of the style is made of them.
# A scheme that wants a part to look otherwise gives that variable a whole value.
[options.scheme]
label = "Color scheme"
default = "graphite"
[options.scheme.graphite]
dark = "grey5"          # the dark end of gradients
mid = "grey30"          # an unfocused face
light = "grey55"        # a focused face
dim = "grey55"          # unfocused text and pictures
edge = "grey60"         # borders and the handle's lower edge
press_dark = "grey20"   # a pressed button's gradient
press_light = "grey40"
menu = "black"          # a menu's background
# Text.
text = "white"
text_effect = { halo = "black" }
glyph = "white"
# What everything not said otherwise is drawn on.
surface = { gradient = "vertical", from = "$mid", to = "$dark" }
# A window's frame.
titlebar = { solid = "$light" }
titlebar_unfocused = { solid = "$mid" }
caption = { gradient = "vertical", from = "$light", to = "$dark" }
caption_text = "$text"
caption_unfocused = { gradient = "vertical", from = "$mid", to = "$dark" }
caption_text_unfocused = "$dim"
button = { gradient = "vertical", from = "$light", to = "$dark" }
button_glyph = "$glyph"
button_unfocused = { gradient = "vertical", from = "$mid", to = "$dark" }
button_glyph_unfocused = "$dim"
button_pressed = { gradient = "cross-diagonal", from = "$press_dark", to = "$press_light", bevel = "sunken" }
handle = { gradient = "vertical", from = "white", to = "$edge", bevel = "raised" }
grip = { gradient = "vertical", from = "$light", to = "$dark", bevel = "raised" }
grip_unfocused = { gradient = "vertical", from = "white", to = "$edge", bevel = "raised" }
border_color = "$edge"
window_radius = 0
window_corners = ["top-left", "top-right", "bottom-left", "bottom-right"]
# The taskbar.
taskbar = "$surface"
taskbar_border = { width = 0, color = "$edge" }
workspace = "$surface"
clock = "$surface"
entry = { gradient = "vertical", from = "$light", to = "$dark", bevel = "raised" }
entry_text = "$text"
entry_unfocused = { gradient = "vertical", from = "$mid", to = "$dark", bevel = "sunken" }
entry_text_unfocused = "$dim"
# Menus.
menu_frame = { gradient = "vertical", from = "$menu", to = "$menu" }
menu_border = { width = 1, color = "$edge" }
menu_radius = 8
menu_corners = ["top-left", "top-right", "bottom-left", "bottom-right"]
menu_text = "$text"
menu_title_face = "$surface"
menu_title_text = "$text"
menu_hover = { gradient = "vertical", from = "$light", to = "$dark", bevel = "raised" }
menu_hover_text = "$text"
menu_check = "$dim"     # a chosen item's mark
menu_check_hovered = "$menu_check"   # and on the item under the pointer, whose
                                     # background it must not match
menu_disabled = "$dim"

# The heights and font sizes of a window's titlebar, the taskbar and a menu,
# each its own option.
[options.titlebar_size]
label = "Titlebar size"
default = "medium"
[options.titlebar_size.small]
titlebar_height = 17
title_font_size = 7
button_pad = 3          # the room round a titlebar button's picture
[options.titlebar_size.medium]
titlebar_height = 20
title_font_size = 8
button_pad = 4
[options.titlebar_size.large]
titlebar_height = 26
title_font_size = 10
button_pad = 5

[options.taskbar_size]
label = "Taskbar size"
default = "medium"
[options.taskbar_size.small]
taskbar_height = 17
taskbar_font_size = 7
[options.taskbar_size.medium]
taskbar_height = 20
taskbar_font_size = 8
[options.taskbar_size.large]
taskbar_height = 26
taskbar_font_size = 10
[options.taskbar_size.xlarge]
taskbar_height = 30
taskbar_font_size = 11

[options.menu_size]
label = "Menu size"
default = "medium"
[options.menu_size.small]
menu_item_height = 17
menu_title_height = 17
menu_font_size = 7
[options.menu_size.medium]
menu_item_height = 20
menu_title_height = 20
menu_font_size = 8
[options.menu_size.large]
menu_item_height = 26
menu_title_height = 26
menu_font_size = 10

# The font family of everything: add your own in
# ~/.config/vaht/options/font/<name>.toml with `font_family = "..."`.
[options.font]
label = "Font"
default = "dejavu_sans"
[options.font.dejavu_sans]
font_family = "DejaVu Sans"
[options.font.liberation_sans]
font_family = "Liberation Sans"
[options.font.sans]
font_family = "sans"    # fontconfig's choice

# A menu's title bar: the scheme's own, or MerleyKay's slate.
[options.menu_title]
label = "Menu title"
default = "scheme"
[options.menu_title.scheme]
menu_title_look = "$menu_title_face"
menu_title_color = "$menu_title_text"
[options.menu_title.slate]
menu_title_look = { gradient = "horizontal", from = "#626670", to = "#566068", bevel = "raised" }
menu_title_color = "#e9e9e9"

# What a menu marks a submenu and a chosen item with.
[options.menu_marks]
label = "Menu marks"
default = "classic"
[options.menu_marks.classic]
bullet = "triangle"
bullet_hovered = "triangle"
check = "box"
[options.menu_marks.chevrons]
bullet = "chevron"
bullet_hovered = "double-chevron"   # the item under the pointer
check = "tick"

[default]
texture = "$surface"
font = { family = "$font_family", size = "$title_font_size", weight = "bold" }
text_effect = "$text_effect"
text_color = "$text"
glyph_color = "$glyph"
justify = "center"

[window.titlebar]
texture = "$titlebar"
height = "$titlebar_height"

[window.titlebar.unfocused]
texture = "$titlebar_unfocused"

[window.label]
texture = "$caption"
text_color = "$caption_text"
padding = [0, 4, 0, 4]

[window.label.unfocused]
texture = "$caption_unfocused"
text_color = "$caption_text_unfocused"

[window.button]
texture = "$button"
glyph_color = "$button_glyph"
# The room round a button's picture: the button is 20 pixels, so 4 leaves a
# 12 pixel picture (Fluxbox draws it 2 pixels inside, a 16 pixel picture).
padding = "$button_pad"
# Whether a maximized window's maximize button is drawn as a restore button
# (the default); false keeps it the maximize button.
# restore_glyph = false

[window.button.unfocused]
texture = "$button_unfocused"
glyph_color = "$button_glyph_unfocused"

[window.button.pressed]
texture = "$button_pressed"

[window.handle]
texture = "$handle"
height = 1

[window.grip]
texture = "$grip"

[window.grip.unfocused]
texture = "$grip_unfocused"

[window.border]
border = { width = 1, color = "$border_color" }
corner_radius = "$window_radius"
corners = "$window_corners"

[taskbar]
texture = "$taskbar"
border = "$taskbar_border"
height = "$taskbar_height"

[taskbar.button]
padding = 0

[taskbar.button.pressed]
texture = "$button_pressed"

[taskbar.workspace]
texture = "$workspace"
font = { family = "$font_family", size = "$taskbar_font_size", weight = "bold" }
padding = [0, 1, 0, 1]

[taskbar.clock]
texture = "$clock"
font = { family = "$font_family", size = "$taskbar_font_size", weight = "bold" }
padding = [0, 8, 0, 8]

[taskbar.window-list.entry]
texture = "$entry"
font = { family = "$font_family", size = "$taskbar_font_size", weight = "bold" }
text_color = "$entry_text"
padding = [0, 5, 0, 5]

[taskbar.window-list.entry.unfocused]
texture = "$entry_unfocused"
text_color = "$entry_text_unfocused"

[menu.title]
texture = "$menu_title_look"
font = { family = "$font_family", size = "$menu_font_size", weight = "bold" }
text_color = "$menu_title_color"
height = "$menu_title_height"

[menu.frame]
texture = "$menu_frame"
font = { family = "$font_family", size = "$menu_font_size" }
text_color = "$menu_text"
justify = "left"
border = "$menu_border"
corner_radius = "$menu_radius"
corners = "$menu_corners"

[menu.item]
texture = "parent"
font = { family = "$font_family", size = "$menu_font_size" }
text_color = "$menu_text"
glyph_color = "$menu_check"
justify = "left"
padding = [0, 20, 0, 21]
height = "$menu_item_height"
bullet = "$bullet"
bullet_position = "right"
check = "$check"

[menu.item.hovered]
texture = "$menu_hover"
font = { family = "$font_family", size = "$menu_font_size", weight = "bold" }
text_color = "$menu_hover_text"
glyph_color = "$menu_check_hovered"
bullet = "$bullet_hovered"

[menu.item.disabled]
text_color = "$menu_disabled"

[wireframe]
border = { width = 2, color = "#ffffffcc" }

[tooltip]
texture = { solid = "#000000" }
font = { family = "DejaVu Sans", size = 11 }
text_color = "#ffffff"
justify = "left"
padding = [8, 14, 8, 13]
border = { width = 1, color = "#191919" }
corner_radius = 5

[warning]
# Impossible to miss: white on red.
texture = { gradient = "vertical", from = "red3", to = "red4" }
font = { family = "DejaVu Sans", size = 11, weight = "bold" }
text_effect = "none"
text_color = "white"
justify = "left"
padding = [4, 14, 4, 14]
border = { width = 2, color = "white" }
