# xdg-desktop-portal backends for vaht (see portals.conf(5)); vaht sets
# XDG_CURRENT_DESKTOP=vaht for the programs it starts. Screen sharing and
# screenshots go through the wlroots portal, which uses vaht's
# ext-image-copy-capture; file choosers, settings and the rest go through
# the GTK one. Install as /usr/share/xdg-desktop-portal/vaht-portals.conf,
# or for one user as ~/.config/xdg-desktop-portal/vaht-portals.conf.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Inhibit=none
