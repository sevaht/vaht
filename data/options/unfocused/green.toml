# green: the colors of unfocused windows, for a style with an `unfocused`
# option (the default style has one): those of the green palette, so a style in
# another palette has its unfocused windows and the rest of the taskbar in them.
# Installed as /usr/share/vaht/options/unfocused/green.toml; copy it to
# ~/.config/vaht/options/unfocused/<name>.toml and change it to make your own,
# and choose it with `style_options = { unfocused = "<name>" }` in settings.toml.

group = "Greens"
unf_dark = "#08120b"
unf_mid = "#2e6b42"
unf_dark_soft = "#2f4235"
unf_mid_soft = "#3b5444"
unf_press_dark = "#1f472c"
unf_press_light = "#3d8f58"
unf_dim = "grey55"
unf_text = "white"
