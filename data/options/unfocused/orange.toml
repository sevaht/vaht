# orange: the colors of unfocused windows, for a style with an `unfocused`
# option (the default style has one): those of the orange palette, so a style in
# another palette has its unfocused windows and the rest of the taskbar in them.
# Installed as /usr/share/vaht/options/unfocused/orange.toml; copy it to
# ~/.config/vaht/options/unfocused/<name>.toml and change it to make your own,
# and choose it with `style_options = { unfocused = "<name>" }` in settings.toml.

group = "Warm"
unf_dark = "#160b04"
unf_mid = "#824217"
unf_dark_soft = "#42362f"
unf_mid_soft = "#54453b"
unf_press_dark = "#572c0f"
unf_press_light = "#ad581f"
unf_dim = "grey55"
unf_text = "white"
