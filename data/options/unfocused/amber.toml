# amber: the colors of unfocused windows, for a style with an `unfocused`
# option (the default style has one): those of the amber palette, so a style in
# another palette has its unfocused windows and the rest of the taskbar in them.
# Installed as /usr/share/vaht/options/unfocused/amber.toml; copy it to
# ~/.config/vaht/options/unfocused/<name>.toml and change it to make your own,
# and choose it with `style_options = { unfocused = "<name>" }` in settings.toml.

group = "Warm"
unf_dark = "#140e06"
unf_mid = "#775422"
unf_dark_soft = "#423a2f"
unf_mid_soft = "#544a3b"
unf_press_dark = "#4f3817"
unf_press_light = "#9e6f2e"
unf_dim = "grey55"
unf_text = "white"
