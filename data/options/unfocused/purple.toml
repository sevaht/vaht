# purple: the colors of unfocused windows, for a style with an `unfocused`
# option (the default style has one): those of the purple palette, so a style in
# another palette has its unfocused windows and the rest of the taskbar in them.
# Installed as /usr/share/vaht/options/unfocused/purple.toml; copy it to
# ~/.config/vaht/options/unfocused/<name>.toml and change it to make your own,
# and choose it with `style_options = { unfocused = "<name>" }` in settings.toml.

group = "Reds and purples"
unf_dark = "#0d0812"
unf_mid = "#4c2e6b"
unf_dark_soft = "#382f42"
unf_mid_soft = "#473b54"
unf_press_dark = "#331f47"
unf_press_light = "#663d8f"
unf_dim = "grey55"
unf_text = "white"
