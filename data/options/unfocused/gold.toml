# gold: the colors of unfocused windows, for a style with an `unfocused`
# option (the default style has one): those of the gold palette, so a style in
# another palette has its unfocused windows and the rest of the taskbar in them.
# Installed as /usr/share/vaht/options/unfocused/gold.toml; copy it to
# ~/.config/vaht/options/unfocused/<name>.toml and change it to make your own,
# and choose it with `style_options = { unfocused = "<name>" }` in settings.toml.

group = "Warm"
unf_dark = "#151104"
unf_mid = "#7e671b"
unf_dark_soft = "#423d2f"
unf_mid_soft = "#544e3b"
unf_press_dark = "#544512"
unf_press_light = "#a88924"
unf_dim = "grey55"
unf_text = "white"
