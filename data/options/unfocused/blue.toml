# blue: the colors of unfocused windows, for a style with an `unfocused`
# option (the default style has one): those of the blue palette, so a style in
# another palette has its unfocused windows and the rest of the taskbar in them.
# Installed as /usr/share/vaht/options/unfocused/blue.toml; copy it to
# ~/.config/vaht/options/unfocused/<name>.toml and change it to make your own,
# and choose it with `style_options = { unfocused = "<name>" }` in settings.toml.

group = "Blues"
unf_dark = "#060c13"
unf_mid = "#264673"
unf_dark_soft = "#2e3440"
unf_mid_soft = "#3b4252"
unf_press_dark = "#192f4d"
unf_press_light = "#335d99"
unf_dim = "grey55"
unf_text = "#d8dee9"
