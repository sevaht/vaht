# cyan: the colors of unfocused windows, for a style with an `unfocused`
# option (the default style has one): those of the cyan palette, so a style in
# another palette has its unfocused windows and the rest of the taskbar in them.
# Installed as /usr/share/vaht/options/unfocused/cyan.toml; copy it to
# ~/.config/vaht/options/unfocused/<name>.toml and change it to make your own,
# and choose it with `style_options = { unfocused = "<name>" }` in settings.toml.

group = "Blues"
unf_dark = "#051114"
unf_mid = "#1f637a"
unf_dark_soft = "#2f3d42"
unf_mid_soft = "#3b4d54"
unf_press_dark = "#144252"
unf_press_light = "#2985a3"
unf_dim = "grey55"
unf_text = "white"
