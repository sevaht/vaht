# slate: the colors of unfocused windows, for a style with an `unfocused`
# option (the default style has one): those of the slate palette, so a style in
# another palette has its unfocused windows and the rest of the taskbar in them.
# Installed as /usr/share/vaht/options/unfocused/slate.toml; copy it to
# ~/.config/vaht/options/unfocused/<name>.toml and change it to make your own,
# and choose it with `style_options = { unfocused = "<name>" }` in settings.toml.

group = "Neutral"
unf_dark = "#0a0d0f"
unf_mid = "#3f4c5a"
unf_dark_soft = "#2f3842"
unf_mid_soft = "#3b4754"
unf_press_dark = "#2a333c"
unf_press_light = "#546678"
unf_dim = "grey55"
unf_text = "white"
