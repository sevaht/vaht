# crimson: the colors of unfocused windows, for a style with an `unfocused`
# option (the default style has one): those of the crimson palette, so a style in
# another palette has its unfocused windows and the rest of the taskbar in them.
# Installed as /usr/share/vaht/options/unfocused/crimson.toml; copy it to
# ~/.config/vaht/options/unfocused/<name>.toml and change it to make your own,
# and choose it with `style_options = { unfocused = "<name>" }` in settings.toml.

group = "Reds and purples"
unf_dark = "#130608"
unf_mid = "#732633"
unf_dark_soft = "#422f32"
unf_mid_soft = "#543b3f"
unf_press_dark = "#4d1922"
unf_press_light = "#993344"
unf_dim = "grey55"
unf_text = "white"
