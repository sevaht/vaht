# indigo: the colors of unfocused windows, for a style with an `unfocused`
# option (the default style has one): those of the indigo palette, so a style in
# another palette has its unfocused windows and the rest of the taskbar in them.
# Installed as /usr/share/vaht/options/unfocused/indigo.toml; copy it to
# ~/.config/vaht/options/unfocused/<name>.toml and change it to make your own,
# and choose it with `style_options = { unfocused = "<name>" }` in settings.toml.

group = "Blues"
unf_dark = "#060613"
unf_mid = "#262673"
unf_dark_soft = "#2f2f42"
unf_mid_soft = "#3b3b54"
unf_press_dark = "#19194d"
unf_press_light = "#333399"
unf_dim = "grey55"
unf_text = "white"
