# blue: a color palette for styles with a `palette` option (the default style
# has one): muted blue-greys with a frost-blue accent, after the Nord colors.
# Installed as /usr/share/vaht/options/palette/blue.toml; copy it to
# ~/.config/vaht/options/palette/<name>.toml and change it to make your own, and
# choose it with `style_options = { palette = "<name>" }` in settings.toml.

group = "Blues"
dark = "#060c13"
mid = "#264673"
dark_soft = "#2e3440"
mid_soft = "#3b4252"
press_dark = "#192f4d"
press_light = "#335d99"
menu = "#04070b"
text = "#d8dee9"
accent = "#5e81ac"
on_accent = "#eceff4"
disabled = "#4c566a"
menu_filled = "#222830"   # a menu's body, when it is filled in: dark and muted, in the hue
select_bg = "#5e81ac40"   # behind the selected item
select_text = "#8da5c4"   # its text, and its marks
select_bg_filled = "#5e81ac40"   # behind the selected item of a filled-in menu
select_text_filled = "#9db3cd"   # its text, and its marks
