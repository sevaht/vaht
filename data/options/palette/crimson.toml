# crimson: a color palette for styles with a `palette` option (the default style
# has one): the greys of the default look tinted crimson. It sets the variables
# the default style defines; `dim` (unfocused text and pictures) is left alone.
# Installed as /usr/share/vaht/options/palette/crimson.toml; copy it to
# ~/.config/vaht/options/palette/<name>.toml and change it to make your own, and
# choose it with `style_options = { palette = "<name>" }` in settings.toml.

group = "Reds and purples"
dark = "#130608"
mid = "#732633"
dark_soft = "#422f32"
mid_soft = "#543b3f"
light = "#b46471"
press_dark = "#4d1922"
press_light = "#993344"
menu = "#0b0405"
menu_filled = "#302224"   # a menu's body, when it is filled in: dark and muted, in the hue
select_bg = "#b4647140"   # behind the selected item
select_text = "#cb949d"   # its text, and its marks
select_bg_filled = "#b4647140"   # behind the selected item of a filled-in menu
select_text_filled = "#d2a2aa"   # its text, and its marks
