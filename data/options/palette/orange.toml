# orange: a color palette for styles with a `palette` option (the default style
# has one): the greys of the default look tinted orange. It sets the variables
# the default style defines; `dim` (unfocused text and pictures) is left alone.
# Installed as /usr/share/vaht/options/palette/orange.toml; copy it to
# ~/.config/vaht/options/palette/<name>.toml and change it to make your own, and
# choose it with `style_options = { palette = "<name>" }` in settings.toml.

group = "Warm"
dark = "#160b04"
mid = "#824217"
dark_soft = "#42362f"
mid_soft = "#54453b"
light = "#c48154"
press_dark = "#572c0f"
press_light = "#ad581f"
menu = "#0d0702"
menu_filled = "#302722"   # a menu's body, when it is filled in: dark and muted, in the hue
select_bg = "#c4815440"   # behind the selected item
select_text = "#d3a07e"   # its text, and its marks
select_bg_filled = "#c4815440"   # behind the selected item of a filled-in menu
select_text_filled = "#dab195"   # its text, and its marks
