# brown: a color scheme for styles with a `scheme` option (the default style
# has one): the greys of the default look tinted brown. It sets the variables
# the default style defines; `dim` (unfocused text and pictures) is left alone.
# Installed as /usr/share/vaht/options/scheme/brown.toml; copy it to
# ~/.config/vaht/options/scheme/<name>.toml and change it to make your own, and
# choose it with `style_options = { scheme = "<name>" }` in settings.toml.

dark = "#110c08"
mid = "#674832"
light = "#a88870"
edge = "#b29580"
press_dark = "#453021"
press_light = "#8a6042"
menu = "#0a0705"
