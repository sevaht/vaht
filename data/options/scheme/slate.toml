# slate: a color scheme for styles with a `scheme` option (the default style
# has one): the greys of the default look tinted slate. It sets the variables
# the default style defines; `dim` (unfocused text and pictures) is left alone.
# Installed as /usr/share/vaht/options/scheme/slate.toml; copy it to
# ~/.config/vaht/options/scheme/<name>.toml and change it to make your own, and
# choose it with `style_options = { scheme = "<name>" }` in settings.toml.

dark = "#0a0d0f"
mid = "#3f4c5a"
light = "#7e8c9b"
edge = "#8c99a6"
press_dark = "#2a333c"
press_light = "#546678"
menu = "#060809"
