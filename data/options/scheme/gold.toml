# gold: a color scheme for styles with a `scheme` option (the default style
# has one): the greys of the default look tinted gold. It sets the variables
# the default style defines; `dim` (unfocused text and pictures) is left alone.
# Installed as /usr/share/vaht/options/scheme/gold.toml; copy it to
# ~/.config/vaht/options/scheme/<name>.toml and change it to make your own, and
# choose it with `style_options = { scheme = "<name>" }` in settings.toml.

dark = "#151104"
mid = "#7e671b"
light = "#c0a858"
edge = "#c7b26b"
press_dark = "#544512"
press_light = "#a88924"
menu = "#0d0a03"
