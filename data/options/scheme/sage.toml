# sage: a color scheme for styles with a `scheme` option (the default style
# has one): the palette of the sage Fluxbox style, with what each part of the
# style is made of it. Colors only are taken from that style, none of its files.
# Installed as /usr/share/vaht/options/scheme/sage.toml; copy it to
# ~/.config/vaht/options/scheme/<name>.toml and change it to make your own, and
# choose it with `style_options = { scheme = "sage" }` in settings.toml.

dark = "#171c1a"
mid = "#2c3431"
light = "#9bb8aa"
dim = "#8a9690"
edge = "#0c0f0e"
press_dark = "#3a4843"
press_light = "#262e2b"
menu = "#1b211f"

text = "#d5dcd8"
text_effect = "none"
glyph = "#9bb8aa"
surface = { gradient = "vertical", from = "#262e2b", to = "$dark" }

titlebar = { gradient = "vertical", from = "$light", to = "#5b7569" }
titlebar_unfocused = { gradient = "vertical", from = "$mid", to = "#1e2522" }
caption = { gradient = "vertical", from = "$light", to = "#5b7569" }
caption_text = "#121816"
caption_unfocused = { gradient = "vertical", from = "$mid", to = "#1e2522" }
caption_text_unfocused = "$dim"
button = { gradient = "vertical", from = "$light", to = "#5b7569" }
button_glyph = "#121816"
button_unfocused = { gradient = "vertical", from = "$mid", to = "#1e2522" }
button_glyph_unfocused = "#6b7772"
button_pressed = { gradient = "vertical", from = "$press_dark", to = "$press_light" }
handle = { gradient = "vertical", from = "#6f8c7f", to = "#5b7569" }
grip = { solid = "#8fa89c" }
grip_unfocused = { solid = "$mid" }
window_radius = 8
window_corners = ["top-left", "top-right"]

taskbar_border = { width = 1, color = "$edge" }
entry = { gradient = "vertical", from = "$light", to = "#5b7569" }
entry_text = "#121816"
entry_unfocused = { gradient = "vertical", from = "#262e2b", to = "$dark" }
entry_text_unfocused = "$dim"

menu_frame = { gradient = "vertical", from = "#262e2b", to = "$menu" }
menu_corners = ["top-left", "top-right"]
menu_title_face = { gradient = "vertical", from = "$light", to = "#5b7569", bevel = "raised" }
menu_title_text = "#121816"
menu_hover = { gradient = "vertical", from = "$light", to = "#6f8c7f" }
menu_hover_text = "#121816"
menu_check = "$light"
menu_check_hovered = "#121816"
menu_disabled = "$dim"
