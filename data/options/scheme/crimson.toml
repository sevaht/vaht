# crimson: a color scheme for styles with a `scheme` option (the default style
# has one): the greys of the default look tinted crimson. It sets the variables
# the default style defines; `dim` (unfocused text and pictures) is left alone.
# Installed as /usr/share/vaht/options/scheme/crimson.toml; copy it to
# ~/.config/vaht/options/scheme/<name>.toml and change it to make your own, and
# choose it with `style_options = { scheme = "<name>" }` in settings.toml.

dark = "#130608"
mid = "#732633"
light = "#b46471"
edge = "#bd7581"
press_dark = "#4d1922"
press_light = "#993344"
menu = "#0b0405"
