# amber: a color scheme for styles with a `scheme` option (the default style
# has one): the greys of the default look tinted amber. It sets the variables
# the default style defines; `dim` (unfocused text and pictures) is left alone.
# Installed as /usr/share/vaht/options/scheme/amber.toml; copy it to
# ~/.config/vaht/options/scheme/<name>.toml and change it to make your own, and
# choose it with `style_options = { scheme = "<name>" }` in settings.toml.

dark = "#140e06"
mid = "#775422"
light = "#b89460"
edge = "#c0a072"
press_dark = "#4f3817"
press_light = "#9e6f2e"
menu = "#0c0803"
