# orange: a color scheme for styles with a `scheme` option (the default style
# has one): the greys of the default look tinted orange. It sets the variables
# the default style defines; `dim` (unfocused text and pictures) is left alone.
# Installed as /usr/share/vaht/options/scheme/orange.toml; copy it to
# ~/.config/vaht/options/scheme/<name>.toml and change it to make your own, and
# choose it with `style_options = { scheme = "<name>" }` in settings.toml.

dark = "#160b04"
mid = "#824217"
light = "#c48154"
edge = "#cb8f67"
press_dark = "#572c0f"
press_light = "#ad581f"
menu = "#0d0702"
