# cyan: a color scheme for styles with a `scheme` option (the default style
# has one): the greys of the default look tinted cyan. It sets the variables
# the default style defines; `dim` (unfocused text and pictures) is left alone.
# Installed as /usr/share/vaht/options/scheme/cyan.toml; copy it to
# ~/.config/vaht/options/scheme/<name>.toml and change it to make your own, and
# choose it with `style_options = { scheme = "<name>" }` in settings.toml.

dark = "#051114"
mid = "#1f637a"
light = "#5ca4bc"
edge = "#6eaec4"
press_dark = "#144252"
press_light = "#2985a3"
menu = "#030a0c"
