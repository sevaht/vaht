[licenses]
# Permissive licenses, plus MPL-2.0: its copyleft covers only the dependency's
# own files, never vaht's. Strong copyleft (GPL, AGPL) is decided case by case.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC",
         "MPL-2.0", "Unicode-3.0", "Unlicense", "Zlib"]
unused-allowed-license = "allow"   # the list is policy, not an inventory

[advisories]
yanked = "deny"
ignore = [
    # `paste` is archived (unmaintained, no known vulnerability). It is a
    # build-time macro reached only through pixman, Smithay's software
    # renderer. Recheck whenever Smithay is bumped.
    { id = "RUSTSEC-2024-0436", reason = "build-time only, via pixman; no vulnerability" },
]

[bans]
wildcards = "deny"           # no `version = "*"` dependencies
allow-wildcard-paths = true  # the workspace's own crates, which are not published
multiple-versions = "allow"  # transitive duplicates are not ours to fix (as in clippy)

[sources]
# Smithay is used from its git repository (see Cargo.toml).
allow-git = ["https://github.com/Smithay/smithay"]
