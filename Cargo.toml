[workspace]
resolver = "3"
members = ["crates/*"]

# Metadata every crate inherits (`field.workspace = true`). Each crate states
# its own `description`, `keywords` and `categories`.
[workspace.package]
version = "0.1.0"
edition = "2024"
# The toolchain vaht is built and tested with. Smithay itself needs 1.88; this
# is higher because nothing checks that vaht still builds on anything older.
rust-version = "1.99"
authors = ["Jacob McIntosh"]
license = "MIT"
repository = "https://github.com/sevaht/vaht"
readme = "README.md"
# vaht depends on a Smithay git revision, which crates.io does not accept.
publish = false

# Every dependency's version is chosen once, here (P5); crates name them with
# `dependency.workspace = true`.
[workspace.dependencies]
anyhow = "1"
# The version Smithay uses, so the two unify into one event loop type.
calloop = { version = "0.14.5", features = ["executor", "signals"] }
clap = { version = "4", features = ["derive", "env"] }
cosmic-text = "0.19"
file-rotate = "0.8"
# `StreamExt`, to read D-Bus signal streams; zbus already depends on it.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
jiff = "0.2"
nix = { version = "0.31", features = ["inotify", "poll", "process", "signal", "socket", "time"] }
procfs = "0.18"
proptest = "1"
regex = "1"
reis = { version = "0.7", features = ["calloop"] }
rstest = { version = "0.28", default-features = false }
# The IPC protocol's JSON Schema, from its message types.
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
# The IPC protocol's messages: one JSON value per line.
serde_json = "1"
# Pinned to a reviewed master revision (Smithay's releases lag far behind);
# bump deliberately, one bump per commit (docs/design/04 §5).
smithay = { version = "0.7.0", git = "https://github.com/Smithay/smithay", rev = "ae6921bbbf464ae90122f0c184e95e89093a4257", default-features = false, features = ["backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "backend_winit", "desktop", "renderer_gl", "renderer_multi", "renderer_pixman", "wayland_frontend", "xwayland", "backend_libei"] }
# Connectors appearing and going, and what their monitors' EDID says.
smithay-drm-extras = { version = "0.1", git = "https://github.com/Smithay/smithay", rev = "ae6921bbbf464ae90122f0c184e95e89093a4257" }
# Test clients and the dialogs. No default features here: the dialogs ask
# for the event loop and keymap code they need, test clients need neither.
smithay-client-toolkit = { version = "0.21", default-features = false }
strum = { version = "0.28", features = ["derive"] }
tempfile = "3"
thiserror = "2"
tiny-skia = { version = "0.12", features = ["png-format"] }
# Raster images (wallpapers, icons) in every common format, chosen by their
# contents; no encoders or threads, which vaht does not need.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
# Application icons drawn as SVG; no text or fonts, which icons do not need.
resvg = { version = "0.49", default-features = false }
toml = "1"
# X11 windows' shapes, for vaht and the X11 test client.
x11rb = { version = "0.14", features = ["shape", "xtest"] }
# Pointer pictures from the xcursor theme, on outputs vaht draws the pointer on.
xcursor = "0.3"
toml_edit = "0.25"
tracing = "0.1"
tracing-appender = "0.2"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# D-Bus: system services (timedated) and, later, the tray. Its own runtime
# (the default) keeps tokio out; vaht polls its futures on the event loop.
zbus = "6.2"
vaht-compositor = { path = "crates/vaht-compositor" }
vaht-dialog = { path = "crates/vaht-dialog" }
vaht-import = { path = "crates/vaht-import" }
vaht-ipc = { path = "crates/vaht-ipc" }
vaht-ui = { path = "crates/vaht-ui" }
vaht-test-support = { path = "crates/vaht-test-support" }
xdg = "3"

# Dev builds keep only file and line tables for vaht's own crates, and no
# debug info for dependencies: enough for backtraces, and it keeps each
# test binary, which links all of Smithay, small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Full debug info, for a debugger (variables, types, every crate):
# `cargo build --profile debugging` (or `cargo test --profile debugging`),
# built in target/debugging/.
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = true

[profile.release]
lto = true         # optimize across crate boundaries
codegen-units = 1   # optimize the crate as one unit

# A release build with full debug info, for testing on hardware: as fast
# as a release, with readable backtraces and a debugger's view.
# `cargo build --profile profiling`, built in target/profiling/.
[profile.profiling]
inherits = "release"
debug = true

[workspace.lints.rust]
missing_docs = "warn"
# deny, not forbid: one documented site, the shared-memory copy in
# vaht-compositor (R-X3), carries an #[expect]; anywhere else still fails.
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"   # M-STATIC-VERIFICATION set:
ambiguous_negative_literals = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
missing_crate_level_docs = "warn"

[workspace.lints.clippy]
# Every major group, at warn; individual lints below override (priority).
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Selected `restriction` lints: each one enforces a rule in these standards.
allow_attributes = "warn"                  # use #[expect], never #[allow] (V4)
allow_attributes_without_reason = "warn"   # every override states why (V4)
min_ident_chars = "warn"                   # whole-word names (N1, N3)
missing_docs_in_private_items = "warn"     # docs for everything (R-D1); gates only under --docs
mod_module_files = "warn"                  # name.rs + name/, never mod.rs (R-T3)
unwrap_used = "warn"                       # expect-with-reason or ? (R-E5)
wildcard_enum_match_arm = "warn"           # exhaustive matches (E7, R-M11)
map_err_ignore = "warn"                    # preserve causes (E5)
unused_result_ok = "warn"                  # no silent discards (R-E7)
undocumented_unsafe_blocks = "warn"        # SAFETY comments (R-X2)
print_stdout = "warn"                      # expected only at the CLI output layer
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
clone_on_ref_ptr = "warn"                  # Arc::clone(&x) makes sharing visible
if_then_some_else_none = "warn"
renamed_function_params = "warn"
empty_structs_with_brackets = "warn"

# Opt-outs, each with its reason.
multiple_crate_versions = "allow"          # transitive duplicates are not ours to fix
