# vaht's built-in theme, after the nacitar_fbstyle Fluxbox style by nacitar
# sevaht: dark grey gradients, white haloed text, a thin grey border.
#
# A theme gives a style to each element in each state, in four layers, each
# overriding the one before: [default], [state.<state>], [<element>], and
# [<element>.<state>]. Elements: window.titlebar, window.label,
# window.button, window.handle, window.grip, window.border, taskbar,
# taskbar.button, taskbar.workspace, taskbar.clock,
# taskbar.window-list.entry, taskbar.window-list.empty (the tray shows on
# the taskbar's own background), menu.title, menu.frame, menu.item,
# dialog.field, wireframe (a resize's outline: its border). States:
# focused, unfocused, pressed, hovered (a menu's highlighted item) and
# disabled (a menu item that does nothing).

[default]
font = { family = "DejaVu Sans", size = 8, weight = "bold" }
text_effect = { halo = "black" }
text_color = "white"
glyph_color = "white"
justify = "center"
texture = { gradient = "vertical", from = "grey30", to = "grey5" }
padding = [0, 0, 0, 0]
border = { width = 0, color = "grey60" }

[state.focused]
texture = { gradient = "vertical", from = "grey55", to = "grey5" }

[state.unfocused]
text_color = "grey55"
glyph_color = "grey55"

[state.pressed]
texture = { gradient = "cross-diagonal", from = "grey20", to = "grey40", bevel = "sunken" }

[window.titlebar]
height = 20

[window.label]
padding = [0, 4, 0, 4]

[window.button]
padding = [5, 5, 5, 5]

[window.border]
border = { width = 1, color = "grey60" }

[window.handle]
height = 1
texture = { gradient = "vertical", from = "white", to = "grey60", bevel = "raised" }

[window.grip]
texture = { gradient = "vertical", from = "white", to = "grey60", bevel = "raised" }

[taskbar]
height = 20

[taskbar.button]
padding = [5, 5, 5, 5]

[taskbar.workspace]
padding = [0, 8, 0, 8]

[taskbar.clock]
padding = [0, 8, 0, 8]

[taskbar.window-list.entry]
# Half of Fluxbox's iconTextPadding (10) each side of the title.
padding = [0, 5, 0, 5]

[taskbar.window-list.entry.focused]
texture = { gradient = "vertical", from = "grey55", to = "grey5", bevel = "raised" }

[taskbar.window-list.entry.unfocused]
texture = { gradient = "vertical", from = "grey30", to = "grey5", bevel = "sunken" }

[menu.title]
height = 20
texture = { gradient = "vertical", from = "grey30", to = "grey5" }

[menu.frame]
font = { family = "DejaVu Sans", size = 8 }
justify = "left"
texture = { solid = "black" }
border = { width = 1, color = "grey60" }
corner_radius = 8

[menu.item]
height = 20
font = { family = "DejaVu Sans", size = 8 }
justify = "left"
# The frame shows behind items, as Fluxbox's menu.frame does.
texture = "parent"
# An item-high square each side of the text, as Fluxbox keeps: a toggle's
# or a submenu's mark goes in the right one.
padding = [0, 20, 0, 21]

[menu.item.hovered]
texture = { gradient = "vertical", from = "grey55", to = "grey5", bevel = "raised" }
# Bold, as the style's *.font reaches menu.hilite.font in Fluxbox.
font = { family = "DejaVu Sans", size = 8, weight = "bold" }

[menu.item.disabled]
text_color = "grey55"

[dialog.field]
# Black on white, as fbrun and fluxland-run draw their line. Fluxbox styles
# say nothing of it, so an imported theme takes this section as it is.
texture = { solid = "white" }
font = { family = "Sans", size = 12 }
text_effect = "none"
text_color = "black"
justify = "left"
padding = [0, 2, 0, 2]

[wireframe]
# The outline of a window being resized: white at 80%, two pixels wide, as
# fluxland draws it. Fluxbox styles say nothing of it either.
border = { width = 2, color = "#ffffffcc" }
