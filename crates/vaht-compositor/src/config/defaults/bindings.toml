# vaht's built-in bindings, used when ~/.config/vaht/bindings.toml does not
# exist. A bindings.toml replaces all of them, so copy what you want to keep:
#     vaht config check --print-defaults
#
# Keys: modifiers (Super, Ctrl, Alt, Shift) joined by "+", then an xkb key
# name, such as "Super+T" or "XF86AudioMute".
#
# Mouse: [mouse.<context>], where the context is desktop, titlebar, window
# (anywhere on a window, normally with a modifier), border, taskbar,
# window-list-entry, handle, grip-left or grip-right. A press on a frame part
# looks in that part's context first, then in window. Buttons are Left,
# Middle, Right, Back, Forward, ScrollUp and ScrollDown; "Double+" binds a
# double click, "Drag+" a drag that starts with that button.
#
# Commands: an action ("exec kitty"), an array of commands run in order,
# { repeat = "...", rate = 20 } for a key that repeats while held, or
# { action = "next-window", windows = { ... } } for an action about the
# windows a matcher picks.

[keys]
"Alt+Tab" = { action = "next-window", windows = { workspace = "current" } }
"Alt+Shift+Tab" = { action = "previous-window", windows = { workspace = "current" } }
"Alt+F4" = "close"
"Alt+F9" = "minimize"
"Alt+F10" = "maximize"
"Alt+F11" = "fullscreen"
"Super+Left" = "snap-step left"
"Super+Right" = "snap-step right"
"Super+Up" = "snap-step up"
"Super+Down" = "snap-step down"
"Ctrl+Alt+Left" = "workspace previous"
"Ctrl+Alt+Right" = "workspace next"
"Ctrl+F1" = "workspace 1"
"Ctrl+F2" = "workspace 2"
"Ctrl+F3" = "workspace 3"
"Ctrl+F4" = "workspace 4"
"Super+F1" = "send-to-workspace 1"
"Super+F2" = "send-to-workspace 2"
"Super+F3" = "send-to-workspace 3"
"Super+F4" = "send-to-workspace 4"
"Alt+space" = "window-menu"

[mouse.desktop]
"Left" = "hide-menus"
"Middle" = "workspace-menu"
"Right" = "root-menu"
"ScrollUp" = "workspace previous"
"ScrollDown" = "workspace next"

[mouse.taskbar]
"ScrollUp" = "workspace previous"
"ScrollDown" = "workspace next"

# A window's entry on the taskbar: its window menu, as its titlebar gives, so a
# window that draws its own frame still has one.
[mouse.window-list-entry]
"Right" = "window-menu"

[mouse.window]
"Alt+Left" = ["raise", "focus", "start-moving"]
"Alt+Right" = ["raise", "focus", "start-resizing nearest-corner"]
"Alt+Middle" = "lower"

[mouse.titlebar]
"Double+Left" = "maximize"
"Drag+Left" = "start-moving"
"Middle" = "lower"
"Right" = "window-menu"
