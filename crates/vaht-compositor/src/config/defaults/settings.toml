# vaht's built-in settings: what applies to each key that
# ~/.config/vaht/settings.toml leaves out. Every key is optional.

# The theme: a style and a layout under one name, themes/<name>.toml in this
# directory or in /usr/share/vaht/themes. The `style` and `layout` below, when
# set, win over the theme's.
# theme = "name"

# The style (colors, fonts, textures): styles/<name>.toml in this directory,
# or in /usr/share/vaht/styles. Without it, the theme's, else `vaht`, the
# default style.
# style = "name"

# The layout (a named set of presentation settings: what the taskbar shows,
# the window buttons): layouts/<name>.toml in this directory, or in
# /usr/share/vaht/layouts. It lies under this file: a setting set here wins over
# the layout's, and one left out here comes from the layout. A layout may set
# only what is shown and how it is arranged ([taskbar], [windows.frame], the snap
# picker, blur, window opacity, menu icons), never behavior.
# layout = "name"

[focus]
# click: a window takes focus when clicked. sloppy: when the pointer
# enters it, keeping it while the pointer is on the desktop. strict-sloppy:
# only when the pointer moves into it, never when it comes under the
# pointer.
model = "click"
raise_on_click = true
# With sloppy focus: raise the window the pointer rests on, after a delay.
auto_raise = false
auto_raise_delay_ms = 250
focus_new_windows = true

[placement]
# row, column, row-min-overlap, column-min-overlap, cascade, under-pointer
# or center.
strategy = "row"
row_direction = "left-to-right"     # or right-to-left
column_direction = "top-to-bottom"  # or bottom-to-top

[windows]
# How close a moved window's edge must come to the output's or another
# window's edge to snap to it, in pixels; 0 turns snapping off.
edge_snap_distance = 10
double_click_ms = 250
# How opaque windows are, focused and not: 0 to 255 (opaque). set-alpha
# changes one window's.
focused_alpha = 255
unfocused_alpha = 255
# Whether a window resized by hand takes each size as the pointer moves;
# false shows an outline instead, and the window takes its size when the
# drag ends.
opaque_resize = true

[windows.snapping]
# Whether a window dragged to the output's edge takes that half (the left,
# right or bottom edge), quarter (a corner) or the whole usable area (the
# top edge) when let go; a preview shows where.
enabled = false
# How close, in pixels, the pointer must come to the edge.
zone_distance = 10
# Whether dragging to the top edge shows a picker of layouts: letting go on
# a layout's cell puts the window there.
layout_picker = false
# Each layout's thumbnail width (60 to 300), and how many to a row (0: as
# many as fit).
picker_size = 120
picker_columns = 4
# The layouts: each a list of cells, [x, y, width, height] in thousandths of
# the usable area, as tile takes them.
layouts = [
    [[0, 0, 667, 1000], [667, 0, 333, 1000]],
    [[0, 0, 500, 1000], [500, 0, 500, 1000]],
    [[0, 0, 333, 1000], [333, 0, 667, 1000]],
    [[0, 0, 1000, 500], [0, 500, 1000, 500]],
    [[0, 0, 250, 1000], [250, 0, 500, 1000], [750, 0, 250, 1000]],
    [[0, 0, 333, 1000], [333, 0, 334, 1000], [667, 0, 333, 1000]],
    [[0, 0, 500, 1000], [500, 0, 500, 500], [500, 500, 500, 500]],
    [[0, 0, 500, 500], [500, 0, 500, 500], [0, 500, 500, 500], [500, 500, 500, 500]],
]

[windows.frame]
# Buttons: shade, stick, minimize, maximize, close.
titlebar_left = []
titlebar_right = ["minimize", "maximize", "close"]
# A strip along the bottom, with a resize grip at each end; the style's
# window.handle height sets how tall.
handle = false
# Whether the titlebar shows the window's icon left of its title: the one
# the window names or draws, else its application's.
icon = true

[workspaces]
names = ["Workspace 1", "Workspace 2", "Workspace 3", "Workspace 4"]

[taskbar]
enabled = true
# How many rows tall it is, each as tall as the style's taskbar: a number
# (always that many), or "auto": one, and another whenever the window list
# reaches row_limit, up to max_rows. The window list and the tray wrap across
# the rows; the tray never adds one.
rows = 1
max_rows = 3
# What makes a taskbar with rows = "auto" take another row: entries narrower
# than { percent = <1 to 100> } of the width of the output the taskbar is on,
# or than a number of pixels; or more windows in a row than
# { windows = <1 or more> }. It uses the fewest rows that stay within this.
row_limit = { percent = 15 }
# Whether every output has a taskbar; the one on `output` is then the main
# one, the only one with the tray.
on_every_output = false
# The output it shows on, by name, such as output = "HDMI-A-1"; without one,
# the primary output (outputs.toml).
# Whose windows each taskbar lists: "all" outputs', or its "own-output"'s.
windows = "all"
edge = "bottom"                     # or top
# How much of the edge it spans, 1 to 100 percent, and where it sits when
# narrower: left, center or right.
width_percent = 100
align = "center"
# Whether maximized and tiled windows leave the taskbar uncovered; an
# auto-hiding taskbar never reserves its space.
reserve_space = true
# Whether it hides until the pointer touches its edge, and how long after
# the pointer leaves it it hides again.
auto_hide = false
auto_hide_delay_ms = 500
# Left to right: workspace-previous, workspace-name, workspace-next,
# window-previous, window-next (focusing the window before or after in the
# window list), window-list, tray and clock.
widgets = ["workspace-previous", "workspace-name", "workspace-next", "window-list", "tray", "clock"]

[taskbar.window_list]
# Which windows have an entry: a window matcher, as bindings take one.
show = { workspace = "current" }
# How wide entries are: "fill" shares the whole list equally among them;
# { max = <pixels> } shares it, each at most that wide.
entry_width = "fill"
# Whether entries show their application's icon: the one the window names,
# else its desktop entry's, from the hicolor style or pixmaps.
icons = true

[taskbar.tray]
# Programs' status icons named here (by their id, in any case) go first,
# in this order, and those named in pin_right last.
pin_left = []
pin_right = []
# How long after a click on an item its program may bring its windows
# forward by itself, as its menu often cannot pass a token; 0 for never.
activation_grace_ms = 500

[taskbar.tooltips]
# Whether resting the pointer on an entry whose title does not fit, or on a
# tray item, shows a tooltip, and after how long.
enabled = true
delay_ms = 500

[taskbar.clock]
# strftime: %k:%M is the hour, space-padded, and the minutes.
format = "%k:%M"

[menus]
# How long the pointer rests on a submenu's item before it opens.
submenu_delay_ms = 200
# What typing in an open menu highlights: the first item whose label starts
# with what was typed (item-start), has it anywhere (anywhere), or nothing
# (off). Backspace takes a letter back.
search = "item-start"
# Whether lists of windows show each window's icon beside its title.
window_icons = true

[wallpaper]
# An image (PNG, JPEG, WebP, GIF and other common formats) drawn under everything, such as "~/Pictures/sky.png" ("~/" is
# the home directory; a relative path is from this directory). Without one,
# the desktop is dark grey.
# image = "~/Pictures/sky.png"
# fill (cover the output, cutting off what overflows), fit (all of it,
# with grey beside), center or tile (at its own size), or stretch.
fit = "fill"
# Images of particular workspaces, by number, shown in place of image while
# they are, such as:
# [wallpaper.workspaces]
# 2 = "~/Pictures/beach.png"

[ipc]
# Whether programs other than vaht's own dialogs may run commands over the
# IPC socket (vaht run ...). Asking what is open is always allowed.
allow_commands = true

[session]
# Command lines run once when vaht starts, as exec runs them.
autostart = []
# When the D-Bus and systemd activation environment is told of the session
# (WAYLAND_DISPLAY, DISPLAY, XDG_CURRENT_DESKTOP...), so portals and other
# services find it: "auto" when vaht runs the session from a terminal, not
# nested; "always"; or "never". Emptied again when vaht exits.
update_activation_environment = "auto"

[xwayland]
# Whether vaht starts Xwayland, so X11 programs run; read at start.
enabled = true
# An X resources file loaded into Xwayland when it starts, as xrdb does in
# an X session, such as resources = "~/.Xresources".

[xwayland.input_emulation]
# Which X programs may move the pointer and press keys through XTest (Steam
# Input's desktop controls, xdotool), by the name Xwayland gives them (their
# command, such as "steam"). Programs in neither list are asked about
# ("ask"; an answer lasts until vaht exits), let in ("allow", as on Xorg) or
# refused ("deny").
default = "ask"
allow = []
deny = []

[input]
# How pointing devices behave, as libinput sets them; a setting set
# nowhere keeps libinput's default. Settings go in scopes, the more
# specific winning: [input.all] for every device, [input.touchpad] or
# [input.pointer] (mice, trackballs), and [input.device."<name>"] for one
# device by the name libinput gives it. The settings: tap, tap_drag,
# tap_drag_lock, tap_button_map ("lrm" or "lmr"), natural_scroll,
# left_handed, disable_while_typing, middle_emulation, accel_profile
# ("flat" or "adaptive"), accel_speed (-1 to 1), scroll_method ("none",
# "two-finger", "edge" or "button"), scroll_button (a button code, such as
# 274 for the middle one), click_method ("button-areas" or "click-finger")
# and send_events ("enabled", "disabled" or "disabled-on-external-mouse").
# For example:
#   [input.touchpad]
#   tap = true
#   natural_scroll = true

[blur]
# Whether programs that ask (foot's blur=yes, panels) have what is behind
# them blurred, as frosted glass. Off, vaht tells them it cannot.
enabled = true
# How wide (passes, 1 to 6: each halves the background once more) and how
# soft (spread, 1 to 10 pixels between samples) the blur is.
passes = 3
spread = 3

[logging]
# vaht.log starts anew at each start and once it passes file_size_mb
# megabytes (1 to 1024); the files before it are kept as vaht.log.1 (the
# newest), .2, …, files in all (1 to 100), so the logs take at most
# file_size_mb × files on disk.
file_size_mb = 10
files = 5
# Older log files not written for this many days (1 to 3650) are deleted,
# at start, at each rotation and hourly; unset, they are kept until
# rotation drops them. vaht.log itself is never deleted.
# delete_after_days = 14
