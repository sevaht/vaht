# vaht's built-in menus. A menu ~/.config/vaht/menus.toml defines replaces the
# built-in one of its name, and a built-in menu it leaves out stays, so a
# file need only say what it changes (copy a menu to change it:
#     vaht config check --print-defaults
# ). { builtin = "window" } puts a built-in menu's items in place, to add to
# them without copying.
#
# Each [menu.<name>] has an optional title and its items, top to bottom.
# root-menu opens [menu.root], window-menu [menu.window], workspace-menu
# [menu.workspace], and custom-menu <name> any other.
#
# Items:
#   { label = "...", command = "..." }     runs a command, as bindings write it
#   { label = "...", submenu = "<name>" }  opens [menu.<name>]
#   { toggle = "shade" }                   toggles the window's shade, stick,
#                                          maximize, minimize or fullscreen
#   { generate = "workspaces" }            lists workspaces, send-to-workspace
#                                          or window-list, in a submenu, or in
#                                          place with inline = true; "vaht" is
#                                          vaht's own menu, the same wherever
#                                          it is put
#   { builtin = "window" }                 the items of a built-in menu, in place
#   icon = "name-or-/path/to/image"        on a command, submenu or generated list:
#                                          its icon; an item that runs a program
#                                          shows the program's without one
#                                          (`icon = ""` for none)
#   { separator = true }                   a line
#   { label = "..." }                      text that does nothing

[menu.root]
title = "vaht"
items = [
    { label = "Terminal", command = "exec xterm" },
    { separator = true },
    { generate = "workspaces" },
    { generate = "window-list" },
    { separator = true },
    { generate = "vaht" },
]

[menu.window]
items = [
    { toggle = "shade" },
    { toggle = "stick" },
    { toggle = "maximize" },
    { toggle = "minimize" },
    { label = "Raise", command = "raise" },
    { label = "Lower", command = "lower" },
    { label = "Set Window Title", command = "set-title-dialog" },
    { generate = "send-to-workspace" },
    { generate = "layer" },
    { generate = "alpha" },
    { toggle = "pseudo-transparent" },
    { separator = true },
    { label = "Close", command = "close" },
]

[menu.workspace]
title = "Workspaces"
items = [
    { generate = "workspaces", inline = true },
    { separator = true },
    { label = "New Workspace", command = "add-workspace" },
    { label = "Remove Last", command = "remove-last-workspace" },
]
